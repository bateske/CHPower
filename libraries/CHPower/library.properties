sentence=The CHGame Rev 1.5 board's power section: the USB-PD sink (PD 3.0, PPS) and the protected CN1 output with its meter and cut-off.
paragraph=Drives the CH211 (CC switches, the output's enable) and the INA226 (the output's meter and cut-off) on their own I2C, and the CH32X035's USBPD peripheral as a sink, with every safety inside the library. A sketch is linked with what it calls: CN1, the PD sink and the PD log each come in with their first call. Rev 1.5 only: on any other board it finds no CH211 and refuses everything.
