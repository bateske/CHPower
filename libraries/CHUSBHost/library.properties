sentence=Battery-powered USB host for the CHGame Rev 1.5 board: keyboards, mice and gamepads, on the port or behind a hub.
paragraph=Boot keyboards and mice, HID gamepads (their report descriptor parsed), Xbox 360 and Switch Pro pads, one hub level of four ports, and a probe log. Each kind of device is a driver of its own, linked only when the sketch names it in host::begin(). Host power is the CHPower library's, with its checks: 5 V never goes onto another source's. Rev 1.5 only.
